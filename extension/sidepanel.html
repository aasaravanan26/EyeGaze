<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glance</title>
  <style>
    /* Warm dark is the default; warm light follows the computer's light mode. */
    :root {
      color-scheme: dark;
      --bg: #2a211c;
      --card: #3a2f28;
      --card-edge: #4d3f36;
      --text: #faf6ef;
      --muted: #cbbfb4;
      --accent: #f0997b;
      --icon: #f0997b;
      --primary-bg: #4a1b0c;
      --primary-text: #faece7;
      --primary-sub: #f5c4b3;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #faf6ef;
        --card: #f1efe8;
        --card-edge: #d3d1c7;
        --text: #2c2c2a;
        --muted: #5f5e5a;
        --accent: #d85a30;
        --icon: #993c1d;
        --primary-bg: #faece7;
        --primary-text: #4a1b0c;
        --primary-sub: #993c1d;
      }
    }

    /* Sizes scale with the panel: the side panel can be dragged from very
       narrow to very wide, and the tablet's screen is small. Each size has a
       floor (still readable) and a ceiling (the design size), and follows the
       panel's width in between. Heights follow the panel's height. */
    :root {
      --pad-x: clamp(10px, 4vw, 18px);
      --pad-y: clamp(12px, 3vh, 22px);
      --gap: clamp(8px, 2.5vw, 14px);
      --radius: clamp(12px, 4vw, 20px);
      --font-h1: clamp(18px, 6.5vw, 40px);
      --font-intro: clamp(14px, 4.2vw, 24px);
      --font-btn: clamp(15px, 5vw, 32px);
      --font-sub: clamp(12px, 3.8vw, 20px);
      --font-note: clamp(13px, 3.8vw, 20px);
      --font-key: clamp(18px, 6.5vw, 40px);
      --icon: clamp(22px, 6.5vw, 44px);
      --btn-min: clamp(56px, 11vh, 110px);
      --btn-pad: clamp(10px, 3vw, 20px) clamp(12px, 4vw, 28px);
      --result-h: clamp(44px, 7.5vh, 72px);
      --footer-h: clamp(56px, 10vh, 96px);
    }

    * { box-sizing: border-box; min-width: 0; }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: clamp(10px, 2.5vh, 20px);
      padding: var(--pad-y) var(--pad-x);
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    /* If a screen still can't fit (a very short panel), it scrolls rather
       than spilling over the footer. */
    main { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; overflow-y: auto; }

    /* Words never push past the panel's edge; very long ones break. */
    h1, p, .btn, .facts, .query, #status { overflow-wrap: anywhere; }

    .greeting { margin: 0 0 -8px; font-size: var(--font-note); font-weight: 600; color: var(--icon); }
    h1 { margin: 0 0 4px; font-size: var(--font-h1); line-height: 1.25; }
    .intro { margin: -8px 0 4px; font-size: var(--font-intro); line-height: 1.45; color: var(--muted); }
    #status { flex: none; min-height: 1.5em; font-size: var(--font-note); line-height: 1.4; color: var(--muted); }

    /* ---------- Choices ---------- */

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--gap);
      padding: var(--btn-pad);
      border: 3px solid var(--card-edge);
      border-radius: var(--radius);
      background: var(--card);
      color: inherit;
      font: inherit;
      font-size: var(--font-btn);
      font-weight: 700;
      line-height: 1.2;
      /* Content sits in the middle of the button, whatever its size. */
      justify-content: center;
      text-align: center;
      cursor: pointer;
      max-width: 100%;
    }
    main .btn { flex: 1 0 auto; min-height: var(--btn-min); }
    main .btn.primary { flex: 1.4 0 auto; }
    /* Secondary choices (like Settings on home): always there, but quieter. */
    main .btn.minor {
      flex: 0 0 auto;
      min-height: calc(var(--btn-min) * 0.75);
      background: transparent;
      font-size: var(--font-intro);
      color: var(--muted);
    }
    main .btn.minor .icon { width: calc(var(--icon) * 0.8); height: calc(var(--icon) * 0.8); color: var(--muted); }

    /* Plain sentences, like "What Glance remembers". Not buttons, so they
       don't look like something to select. */
    .facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--gap); }
    .facts li {
      padding-left: var(--pad-x);
      border-left: 3px solid var(--accent);
      font-size: var(--font-intro);
      line-height: 1.45;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.45; cursor: default; border-color: var(--card-edge); }

    /* The moment a choice is made: the whole button fills with the accent. */
    .btn.selected,
    footer .btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      transform: scale(0.97);
      transition: transform 120ms ease-out;
    }
    .btn.selected .icon,
    .btn.selected .sub { color: var(--bg); }

    .btn .icon { flex: none; width: var(--icon); height: var(--icon); color: var(--icon); }
    .btn .text { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .btn .sub { font-size: var(--font-sub); font-weight: 500; color: var(--muted); }
    /* Long titles (common on YouTube) stop at two lines. */
    .btn .label {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .btn.primary { background: var(--primary-bg); border-color: var(--accent); color: var(--primary-text); }
    .btn.primary .sub { color: var(--primary-sub); }
    .btn .art {
      flex: none;
      width: 40%;
      max-width: 170px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: calc(var(--radius) * 0.6);
    }

    .btn.on { border-color: var(--accent); }
    .btn .badge {
      position: absolute;
      top: 10px;
      right: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--card-edge);
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .btn.on .badge { background: var(--accent); color: var(--bg); }

    /* ---------- Typed once, during setup ---------- */

    .field {
      min-height: var(--result-h);
      padding: 0 var(--pad-x);
      border: 3px solid var(--card-edge);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: var(--font-btn);
      outline: none;
    }
    .field:focus { border-color: var(--accent); }

    /* ---------- Search by name ---------- */

    .query {
      display: flex;
      align-items: center;
      flex: none;
      min-height: var(--result-h);
      padding: 6px var(--pad-x);
      border-radius: var(--radius);
      background: var(--card);
      font-size: var(--font-key);
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: pre-wrap;
      line-height: 1.2;
    }
    .query .icon { flex: none; width: calc(var(--icon) * 0.85); height: calc(var(--icon) * 0.85); margin-right: 12px; color: var(--icon); }
    .query::after { content: ""; flex: none; width: 3px; height: 1.1em; margin-left: 4px; background: var(--accent); }

    /* The letter keys take all the remaining height, which never changes. */
    .keys { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); min-height: 0; }
    .keys.wide { grid-template-columns: 1fr 1fr 1fr; }
    .keys .btn { justify-content: center; min-height: 0; padding: 8px; font-size: var(--font-key); }
    .keys .btn .icon { width: var(--icon); height: var(--icon); }

    /* Results area: always room for three compact results, whether it holds
       results, a "searching" message, or nothing yet, so nothing below moves. */
    .results { flex: 0 0 auto; height: calc(3 * var(--result-h) + 2 * 8px); display: flex; flex-direction: column; gap: 8px; }
    .results .btn { flex: 0 0 auto; height: var(--result-h); min-height: 0; padding: 6px 14px; font-size: var(--font-intro); }
    .results .btn .label { -webkit-line-clamp: 1; }
    .results .btn .sub { font-size: calc(var(--font-sub) * 0.9); }
    .results .art { width: clamp(52px, 18vw, 72px); }
    .results .message,
    .message-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px var(--pad-x);
      border: 2px dashed var(--card-edge);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: var(--font-intro);
      line-height: 1.4;
      text-align: center;
    }
    /* Playback keys (Rewind 10s, Forward 10s) hold words, not single letters. */
    main[data-screen="playing"] .keys .btn { flex-direction: column; gap: 8px; font-size: var(--font-btn); }

    main[data-screen="search"] { gap: calc(var(--gap) * 0.85); }
    /* The search screen has no status text; give its line to the keys. */
    main[data-screen="search"] #status { display: none; }

    /* ---------- Back, Home and Something else: same place on every screen ---------- */

    footer { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: calc(var(--gap) * 0.85); height: var(--footer-h); }
    footer .btn {
      justify-content: center;
      gap: 6px;
      padding: 6px;
      border-color: transparent;
      font-size: var(--font-note);
      line-height: 1.15;
      text-align: center;
      color: var(--muted);
    }
    footer .btn .icon { width: clamp(18px, 3.5vw, 28px); height: clamp(18px, 3.5vw, 28px); color: inherit; }
    /* "Something else" may wrap at its space, never mid-word. */
    footer .btn { overflow-wrap: normal; }
    /* In a very narrow panel the footer keeps its icons and drops the words. */
    @media (max-width: 320px) {
      footer .btn { font-size: 0; gap: 0; }
      footer .btn .icon { width: 26px; height: 26px; }
    }
  </style>
</head>
<body>
  <main id="screen"></main>
  <footer>
    <button id="back" class="btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back
    </button>
    <button id="home" class="btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
      Home
    </button>
    <button id="else" class="btn">
      Something else
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
  </footer>
  <script src="connections.js"></script>
  <script src="adapters/youtube-search.js"></script>
  <script src="agent.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
