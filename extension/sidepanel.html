<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glance</title>
  <style>
    /* Warm dark is the default; warm light follows the computer's light mode. */
    :root {
      color-scheme: dark;
      --bg: #2a211c;
      --card: #3a2f28;
      --card-edge: #4d3f36;
      --text: #faf6ef;
      --muted: #cbbfb4;
      --accent: #f0997b;
      --icon: #f0997b;
      --primary-bg: #4a1b0c;
      --primary-text: #faece7;
      --primary-sub: #f5c4b3;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #faf6ef;
        --card: #f1efe8;
        --card-edge: #d3d1c7;
        --text: #2c2c2a;
        --muted: #5f5e5a;
        --accent: #d85a30;
        --icon: #993c1d;
        --primary-bg: #faece7;
        --primary-text: #4a1b0c;
        --primary-sub: #993c1d;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 20px;
      padding: 22px 18px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    main { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

    .greeting { margin: 0 0 -8px; font-size: 15px; font-weight: 600; color: var(--icon); }
    h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.25; }
    .intro { margin: -8px 0 4px; font-size: 17px; line-height: 1.45; color: var(--muted); }
    #status { min-height: 1.5em; font-size: 16px; line-height: 1.4; color: var(--muted); }

    /* ---------- Choices ---------- */

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border: 3px solid var(--card-edge);
      border-radius: 20px;
      background: var(--card);
      color: inherit;
      font: inherit;
      font-size: 21px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    main .btn { flex: 1; min-height: 88px; }
    main .btn.primary { flex: 1.4; }
    /* Secondary choices (like Settings on home): always there, but quieter. */
    main .btn.minor {
      flex: 0 0 auto;
      min-height: 64px;
      background: transparent;
      font-size: 18px;
      color: var(--muted);
    }
    main .btn.minor .icon { width: 24px; height: 24px; color: var(--muted); }

    /* Plain sentences, like "What Glance remembers". Not buttons, so they
       don't look like something to select. */
    .facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 18px; }
    .facts li {
      padding-left: 16px;
      border-left: 3px solid var(--accent);
      font-size: 19px;
      line-height: 1.45;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.45; cursor: default; border-color: var(--card-edge); }

    /* The moment a choice is made: the whole button fills with the accent. */
    .btn.selected,
    footer .btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      transform: scale(0.97);
      transition: transform 120ms ease-out;
    }
    .btn.selected .icon,
    .btn.selected .sub { color: var(--bg); }

    .btn .icon { flex: none; width: 30px; height: 30px; color: var(--icon); }
    .btn .text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .btn .sub { font-size: 16px; font-weight: 500; color: var(--muted); }
    /* Long titles (common on YouTube) stop at two lines. */
    .btn .label {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .btn.primary { background: var(--primary-bg); border-color: var(--accent); color: var(--primary-text); }
    .btn.primary .sub { color: var(--primary-sub); }
    .btn .art {
      flex: none;
      width: 45%;
      max-width: 170px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
    }

    .btn.on { border-color: var(--accent); }
    .btn .badge {
      position: absolute;
      top: 12px;
      right: 14px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--card-edge);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .btn.on .badge { background: var(--accent); color: var(--bg); }

    /* ---------- Search by name ---------- */

    .query {
      display: flex;
      align-items: center;
      min-height: 60px;
      padding: 0 18px;
      border-radius: 16px;
      background: var(--card);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: pre;
    }
    .query .icon { flex: none; width: 26px; height: 26px; margin-right: 12px; color: var(--icon); }
    .query::after { content: ""; width: 3px; height: 32px; margin-left: 4px; background: var(--accent); }

    /* The letter keys take all the remaining height, which never changes. */
    .keys { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
    .keys.wide { grid-template-columns: 1fr 1fr 1fr; }
    .keys .btn { justify-content: center; min-height: 0; padding: 8px; font-size: 28px; }
    .keys .btn .icon { width: 28px; height: 28px; }

    /* Results area: always room for three compact results, whether it holds
       results, a "searching" message, or nothing yet, so nothing below moves. */
    .results { flex: 0 0 auto; height: 182px; display: flex; flex-direction: column; gap: 8px; }
    .results .btn { flex: 0 0 auto; height: 55px; min-height: 0; padding: 6px 14px; font-size: 18px; }
    .results .btn .label { -webkit-line-clamp: 1; }
    .results .btn .sub { font-size: 14px; }
    .results .art { width: 72px; }
    .results .message {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 2px dashed var(--card-edge);
      border-radius: 16px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.4;
      text-align: center;
    }
    /* Playback keys (Rewind 10s, Forward 10s) hold words, not single letters. */
    main[data-screen="playing"] .keys .btn { flex-direction: column; gap: 8px; font-size: 20px; }

    main[data-screen="search"] { gap: 12px; }
    /* The search screen has no status text; give its line to the keys. */
    main[data-screen="search"] #status { display: none; }

    /* ---------- Back, Home and Something else: same place on every screen ---------- */

    footer { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; height: 76px; }
    footer .btn {
      justify-content: center;
      gap: 8px;
      padding: 8px;
      border-color: transparent;
      font-size: 16px;
      text-align: center;
      color: var(--muted);
    }
    footer .btn .icon { width: 20px; height: 20px; color: inherit; }
  </style>
</head>
<body>
  <main id="screen"></main>
  <footer>
    <button id="back" class="btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back
    </button>
    <button id="home" class="btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
      Home
    </button>
    <button id="else" class="btn">
      Something else
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
  </footer>
  <script src="connections.js"></script>
  <script src="adapters/youtube-search.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
