<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Glance</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: 100vh;
      box-sizing: border-box;
      background: #0b0f17;
      color: #f4f6fb;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { margin: 0; font-size: 22px; color: #7ee2a8; }
    button {
      flex: 1;
      max-height: 160px;
      border: 4px solid #2c3650;
      border-radius: 20px;
      background: #18202f;
      color: inherit;
      font: inherit;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { border-color: #7ee2a8; }
    #status { min-height: 3em; font-size: 16px; color: #8a96b2; }
  </style>
</head>
<body>
  <h1>Glance</h1>
  <button id="search">Search Netflix</button>
  <button id="play">Play first result</button>
  <button id="pause">Pause / Play</button>
  <div id="status">Ready.</div>
  <script src="sidepanel.js"></script>
</body>
</html>
